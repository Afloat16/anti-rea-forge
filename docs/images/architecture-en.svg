<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
<title id="title">A release is a boundary.</title>
<desc id="desc">Keep private material separate. Verify the bytes you ship. Authorize sensitive use. Trust boundary: a public client, target-supplied notice or patched local check cannot grant server authority.</desc>
<defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#101d32"/><stop offset="1" stop-color="#080f1d"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#76d9cb" stroke-width="1.7"/></marker></defs>
<rect width="1280" height="790" rx="24" fill="url(#background)"/>
<g font-family="Inter, Noto Sans CJK SC, Noto Sans, Arial, sans-serif">
<text x="48" y="43" font-size="15" fill="#76d9cb" font-weight="700" letter-spacing="2">ANTI-REA FORGE  /  ARCHITECTURE</text>
<text x="48" y="94" font-size="37" fill="#f5f8ff" font-weight="700" >A release is a boundary.</text>
<text x="48" y="130" font-size="19" fill="#aebfd6" font-weight="400" >Keep private material separate. Verify the bytes you ship. Authorize sensitive use.</text>
<text x="48" y="178" font-size="16" fill="#76d9cb" font-weight="700" letter-spacing="1">01  TRUSTED BUILD</text>
<rect x="48" y="196" width="368" height="366" rx="18" fill="#142237" stroke="#31435e"/>
<rect x="72" y="220" width="36" height="4" rx="2" fill="#76d9cb"/>
<text x="72" y="259" font-size="23" fill="#f2f6ff" font-weight="700" >Separate &amp; inspect</text>
<text x="72" y="300" font-size="14" fill="#76d9cb" font-weight="700" letter-spacing="0.8">PRIVATE INPUTS</text>
<text x="72" y="327" font-size="16" fill="#c7d4e7" font-weight="400" >Source, symbols and selected data</text>
<text x="72" y="351" font-size="16" fill="#c7d4e7" font-weight="400" >Keys stay outside build outputs</text>
<text x="72" y="388" font-size="14" fill="#76d9cb" font-weight="700" letter-spacing="0.8">BUILD TRANSFORMS</text>
<text x="72" y="415" font-size="16" fill="#c7d4e7" font-weight="400" >Split maps, ELF and Wasm debug data</text>
<text x="72" y="439" font-size="16" fill="#c7d4e7" font-weight="400" >Seal selected assets or VM instructions</text>
<text x="72" y="476" font-size="14" fill="#76d9cb" font-weight="700" letter-spacing="0.8">RELEASE GATE</text>
<text x="72" y="503" font-size="16" fill="#c7d4e7" font-weight="400" >Decode keys and embedded source maps</text>
<text x="72" y="527" font-size="16" fill="#c7d4e7" font-weight="400" >Require final Wasm linking before release</text>
<path d="M423 387h26" fill="none" stroke="#76d9cb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="456" y="178" font-size="16" fill="#8db8ff" font-weight="700" letter-spacing="1">02  PUBLIC DISTRIBUTION</text>
<rect x="456" y="196" width="368" height="366" rx="18" fill="#142237" stroke="#31435e"/>
<rect x="480" y="220" width="36" height="4" rx="2" fill="#8db8ff"/>
<text x="480" y="259" font-size="23" fill="#f2f6ff" font-weight="700" >Ship verified artifacts</text>
<text x="480" y="300" font-size="14" fill="#8db8ff" font-weight="700" letter-spacing="0.8">APPLICATION</text>
<text x="480" y="327" font-size="16" fill="#c7d4e7" font-weight="400" >Public code + authenticated ciphertext</text>
<text x="480" y="351" font-size="16" fill="#c7d4e7" font-weight="400" >Required ABI and runtime behavior retained</text>
<text x="480" y="388" font-size="14" fill="#8db8ff" font-weight="700" letter-spacing="0.8">SIGNED MANIFEST</text>
<text x="480" y="415" font-size="16" fill="#c7d4e7" font-weight="400" >Exact paths, sizes and file hashes</text>
<text x="480" y="439" font-size="16" fill="#c7d4e7" font-weight="400" >Version and product bound to the signature</text>
<text x="480" y="476" font-size="14" fill="#8db8ff" font-weight="700" letter-spacing="0.8">PUBLICATION RULE</text>
<text x="480" y="503" font-size="16" fill="#c7d4e7" font-weight="400" >Known unsupported format or ambiguity?</text>
<text x="480" y="527" font-size="16" fill="#c7d4e7" font-weight="400" >Stop the release and report the reason.</text>
<path d="M831 387h26" fill="none" stroke="#76d9cb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="864" y="178" font-size="16" fill="#d3adff" font-weight="700" letter-spacing="1">03  AUTHORIZED USE</text>
<rect x="864" y="196" width="368" height="366" rx="18" fill="#142237" stroke="#31435e"/>
<rect x="888" y="220" width="36" height="4" rx="2" fill="#d3adff"/>
<text x="888" y="259" font-size="23" fill="#f2f6ff" font-weight="700" >Authenticate &amp; open</text>
<text x="888" y="300" font-size="14" fill="#d3adff" font-weight="700" letter-spacing="0.8">INDEPENDENT KEY</text>
<text x="888" y="327" font-size="16" fill="#c7d4e7" font-weight="400" >Check product / release / purpose context</text>
<text x="888" y="351" font-size="16" fill="#c7d4e7" font-weight="400" >Authenticate before exposing plaintext</text>
<text x="888" y="388" font-size="14" fill="#d3adff" font-weight="700" letter-spacing="0.8">NATIVE LIFETIME</text>
<text x="888" y="415" font-size="16" fill="#c7d4e7" font-weight="400" >Guarded buffers and explicit clearing</text>
<text x="888" y="439" font-size="16" fill="#c7d4e7" font-weight="400" >Authorized memory remains observable</text>
<text x="888" y="476" font-size="14" fill="#d3adff" font-weight="700" letter-spacing="0.8">SENSITIVE OPERATIONS</text>
<text x="888" y="503" font-size="16" fill="#c7d4e7" font-weight="400" >Trusted service verifies scoped capability</text>
<text x="888" y="527" font-size="16" fill="#c7d4e7" font-weight="400" >Expiry and replay checks before admission</text>
<path d="M1048 614v-37" fill="none" stroke="#76d9cb" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="48" y="614" width="1184" height="103" rx="16" fill="#102b31" stroke="#32615f"/>
<text x="72" y="646" font-size="15" fill="#76d9cb" font-weight="700" letter-spacing="1">TRUSTED ISSUER / PRIVATE STORAGE</text>
<circle cx="76" cy="678" r="4" fill="#76d9cb"/>
<text x="90" y="685" font-size="18" fill="#e1f3ef" font-weight="400" >Maps + ELF / Wasm originals</text>
<circle cx="480" cy="678" r="4" fill="#76d9cb"/>
<text x="494" y="685" font-size="18" fill="#e1f3ef" font-weight="400" >External keys + signing</text>
<circle cx="884" cy="678" r="4" fill="#76d9cb"/>
<text x="898" y="685" font-size="18" fill="#e1f3ef" font-weight="400" >Identity + replay state</text>
<text x="48" y="755" font-size="16" fill="#aebfd6" font-weight="400" >Trust boundary: a public client, target-supplied notice or patched local check cannot grant server authority.</text>
</g>
</svg>
