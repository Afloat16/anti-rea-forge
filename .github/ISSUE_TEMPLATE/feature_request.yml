name: 功能与改进提案
description: 提出清晰的问题、方案和可验证的完成条件。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎 C/C++、Python、Windows 测试、构建工程和逆向研究方向的提案。
        请先描述要解决的问题，再说明方案。当前品牌为 Anti-REA Forge，Python 包名仍为 open-release-guard，CLI/导入名仍为 releaseguard。
        项目漏洞请按 [SECURITY.md](https://github.com/Afloat16/anti-rea-forge/blob/main/SECURITY.md) 报告。
  - type: textarea
    id: problem
    attributes:
      label: 具体问题或使用场景
      description: 当前哪个行为不满足需求？请提供自有或获授权场景，不需要真实凭证或客户数据。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明接口、支持平台和预期行为；也欢迎文档、诊断与测试改进。不要以“绝对无法破解”或未经测量的概率作为功能保证。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 怎样验证完成
      description: 给出可以复现的成功/失败条件、功能及 ABI 检查，并说明计划验证的工具链。计划中的测试不能写成已经通过。
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 兼容性、成本与替代方案
      description: 说明可能的性能、调试、加载方式、公开接口或维护成本影响，以及考虑过的替代方案。
  - type: dropdown
    id: involvement
    attributes:
      label: 你希望如何参与
      options:
        - 提供需求与反馈
        - 尝试文档或测试贡献
        - 尝试实现并提交 PR
