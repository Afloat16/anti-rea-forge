name: Publish verified release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verified-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Afloat16/anti-rea-forge' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Download the exact installation-tested Linux archives
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$CI_RUN_ID" --repo Afloat16/anti-rea-forge --name release-packages-Linux --dir "$RUNNER_TEMP/release-assets"
      - name: Verify CI, source, archive bytes and draft uploads before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python tools/publish_release.py --run-id "$CI_RUN_ID" --artifacts "$RUNNER_TEMP/release-assets"
