name: Qwen exact-head review follow-up validation

on:
  push:
    branches:
      - 'validation/qwen-review-followups-20261117'

permissions:
  contents: read

jobs:
  python-sdk:
    name: 'Python SDK ${{ matrix.python }} stdout shutdown'
    if: github.repository == 'Afloat16/anti-rea-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: '80d12cd242a153e727096a2d01d63559b351b3e9'
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source identity
        env:
          EXPECTED_SHA: '80d12cd242a153e727096a2d01d63559b351b3e9'
          EXPECTED_PARENT: 'ea860cf1392cf9f14e74500e81ef209f3876262b'
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git show -s --format='%H %T %P'
          git diff --stat HEAD^
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '${{ matrix.python }}'
      - name: Install SDK with normal development dependencies
        run: python -m pip install -e 'packages/sdk-python[dev]'
      - name: Python SDK lint, format and type checks
        run: |
          python -m ruff check --config packages/sdk-python/pyproject.toml packages/sdk-python
          python -m ruff format --check --config packages/sdk-python/pyproject.toml packages/sdk-python
          python -m mypy --config-file packages/sdk-python/pyproject.toml packages/sdk-python/src
      - name: Complete Python SDK test suite
        run: python -m pytest -c packages/sdk-python/pyproject.toml packages/sdk-python/tests -q
      - name: Prove new regressions reject exact parent transport
        env:
          BASELINE_SHA: 'ea860cf1392cf9f14e74500e81ef209f3876262b'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          source = Path('packages/sdk-python/src/qwen_code_sdk/transport.py')
          original = source.read_bytes()
          baseline = subprocess.check_output(['git', 'show', os.environ['BASELINE_SHA'] + ':' + str(source)])
          assert baseline != original
          report = Path(os.environ['RUNNER_TEMP']) / 'stdout-shutdown-parent.xml'
          try:
              source.write_bytes(baseline)
              result = subprocess.run([
                  sys.executable, '-m', 'pytest', '-c', 'packages/sdk-python/pyproject.toml',
                  'packages/sdk-python/tests/unit/test_transport_shutdown.py', '-q',
                  '--junitxml=' + str(report),
              ], timeout=180)
              assert result.returncode == 1, 'The unchanged parent must fail assertions, not collection or timeout'
              cases = list(ET.parse(report).getroot().iter('testcase'))
              errors = [case.attrib['name'] for case in cases if case.find('error') is not None]
              failed = {case.attrib['name'] for case in cases if case.find('failure') is not None}
              passed = [case.attrib['name'] for case in cases if case.find('failure') is None and case.find('error') is None and case.find('skipped') is None]
              assert not errors, errors
              required_failures = {'test_query_close_drains_graceful_shutdown_output[130]', 'test_close_drains_paused_stdout_after_process_has_exited'}
              assert required_failures <= failed, (required_failures, failed)
              assert passed, 'At least one unchanged behavior control must still pass'
              print('Exact-parent negative control:', {'failed': sorted(failed), 'passed': passed})
          finally:
              source.write_bytes(original)
          assert source.read_bytes() == original
          PY
          git diff --exit-code
      - name: Build Python distribution wheel
        run: python -m pip wheel --no-deps ./packages/sdk-python --wheel-dir "$RUNNER_TEMP/python-sdk-wheel"
  workspace:
    name: 'Normal workspace build, bundle and typecheck'
    if: github.repository == 'Afloat16/anti-rea-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      QWEN_SKIP_PREPARE: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: '80d12cd242a153e727096a2d01d63559b351b3e9'
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source identity
        env:
          EXPECTED_SHA: '80d12cd242a153e727096a2d01d63559b351b3e9'
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install frozen workspace dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Normal workspace build, development bundle and typecheck
        run: |
          npm run build
          DEV=true npm run bundle
          npm run typecheck
          git diff --exit-code
