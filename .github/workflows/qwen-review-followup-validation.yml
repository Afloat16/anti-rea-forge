name: Qwen exact-head review follow-up validation

on:
  push:
    branches:
      - 'validation/qwen-review-followups-20261117'

permissions:
  contents: read

jobs:
  verify:
    name: 'PR ${{ matrix.pr }} at ${{ matrix.sha }}'
    if: github.repository == 'Afloat16/anti-rea-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: '17578'
            sha: '66973be53b0588576cda98a60b23eea55c2ab61b'
            package: 'cli'
    env:
      CI: 'true'
      QWEN_SKIP_PREPARE: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: '${{ matrix.sha }}'
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source identity
        env:
          EXPECTED_SHA: '${{ matrix.sha }}'
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Produce exact repository formatter output
        run: |
          node --input-type=module <<'NODE'
          import * as prettier from 'prettier';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const file = 'packages/cli/src/ui/utils/MarkdownDisplayCopy.test.tsx';
          const options = await prettier.resolveConfig(file, { editorconfig: true });
          const formatted = await prettier.format(readFileSync(file, 'utf8'), {
            ...options,
            filepath: file,
          });
          console.log('FORMAT_RESULT ' + JSON.stringify({
            prettierVersion: prettier.version,
            file,
            beforeBlob: execFileSync('git', ['hash-object', file], { encoding: 'utf8' }).trim(),
            formatted,
          }));
          NODE
