name: Qwen exact-head review follow-up validation

on:
  push:
    branches:
      - 'validation/qwen-review-followups-20261117'

permissions:
  contents: read

jobs:
  verify:
    name: 'PR ${{ matrix.pr }} at ${{ matrix.sha }}'
    if: github.repository == 'Afloat16/anti-rea-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: '17578'
            sha: '66973be53b0588576cda98a60b23eea55c2ab61b'
            package: 'cli'
    env:
      CI: 'true'
      QWEN_SKIP_PREPARE: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: '${{ matrix.sha }}'
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source identity
        env:
          EXPECTED_SHA: '${{ matrix.sha }}'
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Build and bundle normal workspace
        run: |
          npm run build
          DEV=true npm run bundle
      - name: CLI renderer, copy command and continuation tests
        working-directory: packages/cli
        run: corepack pnpm exec vitest run src/ui/utils/MarkdownDisplayCopy.test.tsx src/ui/utils/MarkdownDisplay.test.tsx src/ui/commands/copyCommand.test.ts src/ui/components/MainContent.test.tsx --retry=0
      - name: Web Shell copy command parity tests
        working-directory: packages/web-shell
        run: corepack pnpm exec vitest run --config vitest.config.ts client/utils/copyCommand.test.ts --retry=0
      - name: Prove new tests fail with the exact preceding renderer
        working-directory: packages/cli
        env:
          BASELINE_SHA: 'ed7fb8a54cb9d44d4263e68f94f8f321ea51af91'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';

          const file = 'src/ui/utils/MarkdownDisplay.tsx';
          const original = readFileSync(file, 'utf8');
          const parent = spawnSync('git', ['rev-parse', 'HEAD^'], { encoding: 'utf8' });
          assert.equal(parent.status, 0);
          assert.equal(parent.stdout.trim(), process.env.BASELINE_SHA);
          const baseline = spawnSync('git', [
            'show',
            process.env.BASELINE_SHA + ':packages/cli/src/ui/utils/MarkdownDisplay.tsx',
          ], { encoding: 'utf8', maxBuffer: 1024 * 1024 });
          assert.equal(baseline.status, 0);
          assert.notEqual(baseline.stdout, original);
          try {
            writeFileSync(file, baseline.stdout);
            const result = spawnSync('corepack', [
              'pnpm', 'exec', 'vitest', 'run',
              'src/ui/utils/MarkdownDisplayCopy.test.tsx',
              'src/ui/components/MainContent.test.tsx',
              '-t', 'Markdown source copy hints|ignores fence-like content in continuation copy offsets',
              '--retry=0',
            ], {
              encoding: 'utf8',
              timeout: 240000,
              maxBuffer: 32 * 1024 * 1024,
            });
            const output = (result.stdout ?? '') + (result.stderr ?? '');
            process.stdout.write(output);
            assert.ifError(result.error);
            assert.equal(result.signal, null, 'Baseline test must finish normally');
            assert.equal(result.status, 1, 'New tests must reject the preceding renderer');
            const plain = output.replace(/\u001b\[[0-9;]*m/g, '');
            assert.match(plain, /Tests\s+12 failed/);
            assert.match(plain, /2 passed/);
            assert.match(plain, /AssertionError/);
            console.log('Confirmed exact-parent regression witness: 12 failed, 2 controls passed');
          } finally {
            writeFileSync(file, original);
          }
          assert.equal(readFileSync(file, 'utf8'), original);
          NODE
      - name: Check patch formatting and lint
        run: |
          corepack pnpm exec prettier --check packages/cli/src/ui/utils/MarkdownDisplay.tsx packages/cli/src/ui/utils/MarkdownDisplayCopy.test.tsx packages/cli/src/ui/components/MainContent.test.tsx
          corepack pnpm exec eslint packages/cli/src/ui/utils/MarkdownDisplay.tsx packages/cli/src/ui/utils/MarkdownDisplayCopy.test.tsx packages/cli/src/ui/components/MainContent.test.tsx
          git diff --exit-code
      - name: Normal CLI typecheck
        working-directory: packages/cli
        run: npm run typecheck
