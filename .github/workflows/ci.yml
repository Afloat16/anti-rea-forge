name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-obfuscation:
    name: LLVM 18 native function transformations / Linux
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build the pinned LLVM pass plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev cmake ninja-build g++ libssl-dev
          git init "$RUNNER_TEMP/obfuscator"
          git -C "$RUNNER_TEMP/obfuscator" remote add origin https://github.com/eshard/obfuscator-llvm.git
          git -C "$RUNNER_TEMP/obfuscator" fetch --depth 1 origin be910da9267b40cbe6ae8c946eb2ef008f6e55f4
          git -C "$RUNNER_TEMP/obfuscator" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/obfuscator" rev-parse HEAD)" = be910da9267b40cbe6ae8c946eb2ef008f6e55f4
          cmake -S "$RUNNER_TEMP/obfuscator" -B "$RUNNER_TEMP/obfuscator-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build "$RUNNER_TEMP/obfuscator-build" --parallel 2
          curl --fail --location --retry 2 --silent --show-error -o "$RUNNER_TEMP/amice.so" https://github.com/fuqiuluo/amice/releases/download/v0.1.6-beta.1/libamice-llvm18-linux-x86_64.so
          echo 'aa4527516a03ddbdc4034e68dece3190110dfe8ff34a4d1a8284e896a733a882' "$RUNNER_TEMP/amice.so" | sha256sum --check --status
          python -m pip install .
      - name: Require real compiler, CLI and semantic regression tests
        env:
          RELEASEGUARD_LLVM_BIN: /usr/lib/llvm-18/bin
          RELEASEGUARD_OBF_PLUGIN: ${{ runner.temp }}/obfuscator-build/libLLVMObfuscator.so
          RELEASEGUARD_AMICE_PLUGIN: ${{ runner.temp }}/amice.so
          RELEASEGUARD_REQUIRE_NATIVE_OBFUSCATION: '1'
          RELEASEGUARD_REQUIRE_NATIVE_VIRTUALIZATION: '1'
        run: |
          python -m unittest tests.test_native_obfuscation tests.test_native_obfuscation_cli tests.test_native_virtualization tests.test_native_virtualization_cli tests.test_native_vm_integers tests.test_native_code_obfuscation tests.test_native_code_seal tests.test_native_code_controls tests.test_sealed_code_controls tests.test_ghidra_function_probe -v
          python -m unittest discover -s benchmarks/ida_function -p 'test_*.py' -v
      - name: Compare all generated native functions and their in-process costs
        run: |
          RG_PLUGIN="$RUNNER_TEMP/obfuscator-build/libLLVMObfuscator.so"
          RG_PLUGIN_SHA="$(sha256sum "$RG_PLUGIN" | cut -d ' ' -f 1)"
          python benchmarks/native_code_controls.py prepare "$RUNNER_TEMP/code-corpus" --llvm-bin /usr/lib/llvm-18/bin --plugin "$RG_PLUGIN" --plugin-sha256 "$RG_PLUGIN_SHA" --vm-plugin "$RUNNER_TEMP/amice.so" --vm-plugin-sha256 aa4527516a03ddbdc4034e68dece3190110dfe8ff34a4d1a8284e896a733a882 --out "$RUNNER_TEMP/code-prepare.json"
          python benchmarks/native_code_controls.py cost "$RUNNER_TEMP/code-corpus" --llvm-bin /usr/lib/llvm-18/bin --out "$RUNNER_TEMP/code-cost.json"
          python benchmarks/sealed_code_controls.py prepare "$RUNNER_TEMP/sealed-code-corpus" --llvm-bin /usr/lib/llvm-18/bin --plugin "$RUNNER_TEMP/amice.so" --plugin-sha256 aa4527516a03ddbdc4034e68dece3190110dfe8ff34a4d1a8284e896a733a882
      - name: Export genuine Ghidra functions, helpers and all initialized data
        run: |
          curl --fail --location --retry 2 --silent --show-error -o "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          for variant in baseline flatten split-flatten-substitution vm; do
            python benchmarks/ghidra_function/probe.py "$RUNNER_TEMP/code-corpus/public/$variant" --archive "$RUNNER_TEMP/ghidra.zip" --include-program --out "$RUNNER_TEMP/code-analysis/$variant"
          done
          for variant in plaintext encrypted key_leak; do
            python benchmarks/ghidra_function/probe.py "$RUNNER_TEMP/sealed-code-corpus/public/$variant" --archive "$RUNNER_TEMP/ghidra.zip" --include-program --out "$RUNNER_TEMP/sealed-code-analysis/$variant"
          done
      - name: Check exported-key extraction and native patch controls
        run: python benchmarks/sealed_code_controls.py analyze "$RUNNER_TEMP/sealed-code-corpus" --observations "$RUNNER_TEMP/sealed-code-analysis" --out "$RUNNER_TEMP/sealed-code-result.json"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: native-function-observations
          path: |
            ${{ runner.temp }}/code-prepare.json
            ${{ runner.temp }}/code-cost.json
            ${{ runner.temp }}/code-corpus/public
            ${{ runner.temp }}/code-analysis
            ${{ runner.temp }}/sealed-code-corpus/public
            ${{ runner.temp }}/sealed-code-corpus/fixture.json
            ${{ runner.temp }}/sealed-code-corpus/envelope.json
            ${{ runner.temp }}/sealed-code-analysis
            ${{ runner.temp }}/sealed-code-result.json
          retention-days: 14
          if-no-files-found: error

  ghidra-token:
    name: Ghidra native assets, tokens, symbols and patched clients / Linux
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install project and check native compiler dependencies
        run: |
          python -m pip install .
          g++ --version
          pkg-config --modversion libcrypto
          RELEASEGUARD_REQUIRE_OPENSSL_NATIVE=1 python -m unittest tests.test_native_token tests.test_native_token_scan tests.test_native_token_cli tests.test_native_asset tests.test_native_asset_cli tests.test_asset_key_scan_cli -v
      - name: Run wrong-input comparison controls on project-owned programs
        run: python benchmarks/native_token_compare.py --out "$RUNNER_TEMP/token-compare.json"
      - name: Analyze three project-owned ELFs with the verified official Ghidra release
        run: |
          curl --fail --location --retry 2 --silent --show-error -o "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
          python benchmarks/ghidra_token/probe.py --archive "$RUNNER_TEMP/ghidra.zip" --python "$(command -v python)" --out "$RUNNER_TEMP/ghidra-token.json"
      - name: Resolve private ELF symbols and replay a patched client against a receipt service
        run: |
          python benchmarks/native_symbol_controls.py prepare "$RUNNER_TEMP/symbol-corpus"
          python benchmarks/native_symbol_controls.py ghidra "$RUNNER_TEMP/symbol-corpus" --archive "$RUNNER_TEMP/ghidra.zip" --out "$RUNNER_TEMP/elf-symbols-ghidra.json"
      - name: Extract native asset bytes and replay gate and crypto-success patches
        run: |
          python benchmarks/native_asset_controls.py prepare "$RUNNER_TEMP/asset-corpus" --bits 64
          python benchmarks/native_asset_controls.py ghidra "$RUNNER_TEMP/asset-corpus" --archive "$RUNNER_TEMP/ghidra.zip" --out "$RUNNER_TEMP/native-assets-ghidra.json"
      - name: Record verified observations (no bearer tokens or raw decompiler output)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          for name in ("ghidra-token", "token-compare"):
              data = json.loads((Path(os.environ["RUNNER_TEMP"]) / (name + ".json")).read_bytes())
              print("TOKEN_OBSERVATION " + name + " " + json.dumps(data, separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: native-token-observations
          path: |
            ${{ runner.temp }}/elf-symbols-ghidra.json
            ${{ runner.temp }}/ghidra-token.json
            ${{ runner.temp }}/token-compare.json
            ${{ runner.temp }}/native-assets-ghidra.json
          if-no-files-found: error
          retention-days: 14

  source-map-recovery:
    name: Real source-map recovery controls / Linux
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install releaseguard and locked experiment-only tools
        run: |
          python -m pip install .
          npm ci --prefix benchmarks/recovery-tools --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Analyze ordinary and public builds with the published REA CLI
        run: node benchmarks/source_map_recovery.mjs --work "$RUNNER_TEMP/recovery-fixture" --python "$(command -v python)" --out "$RUNNER_TEMP/source-map-recovery.json"
      - name: Run the verified Craft Anything CLI on the same fixture
        run: |
          curl --fail --location --retry 2 --silent --show-error -o "$RUNNER_TEMP/craft.tar.gz" https://github.com/storytold/craft-anything/releases/download/v0.5.0/craft-anything-0.5.0-linux-x86_64.tar.gz
          python benchmarks/craft_source_map_boundary.py --archive "$RUNNER_TEMP/craft.tar.gz" --baseline "$RUNNER_TEMP/recovery-fixture/baseline" --public "$RUNNER_TEMP/recovery-fixture/public" --private "$RUNNER_TEMP/recovery-fixture/private" --output "$RUNNER_TEMP/craft-source-map.json"
      - name: Record machine-readable results
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          for name in ("source-map-recovery", "craft-source-map"):
              data = json.loads((Path(os.environ["RUNNER_TEMP"]) / (name + ".json")).read_bytes())
              print("RECOVERY_EVIDENCE " + name + " " + json.dumps(data, separators=(",", ":")))
          PY
      - name: Keep synthetic reports only
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: source-map-recovery-evidence
          path: |
            ${{ runner.temp }}/source-map-recovery.json
            ${{ runner.temp }}/craft-source-map.json
          retention-days: 14
          if-no-files-found: error

  javascript:
    name: JavaScript / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the shared Python core
        run: python -m pip install -e .

      - name: Select the installed interpreter for isolated SDK calls
        run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('RELEASEGUARD_PYTHON=' + sys.executable + '\n')"

      - name: Test the dependency-free JavaScript bridge
        run: npm test --prefix packages/releaseguard

      - name: Test against the installed Python CLI
        run: npm run test:integration --prefix packages/releaseguard

      - name: Check TypeScript declarations
        if: runner.os == 'Linux'
        run: npm exec --yes --package=typescript@7.0.2 -- tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 packages/releaseguard/test/types-smoke.ts

      - name: Exercise portable checks without a native toolchain
        run: python -m unittest tests.test_distribution tests.test_distribution_cli tests.test_project tests.test_analysis tests.test_analysis_cli tests.test_split_maps tests.test_split_maps_cli -v

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test C++ components with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          if errorlevel 1 exit /b 1
          set CXX=cl
          python -m unittest tests.test_native_literal tests.test_secure_buffer -v

      - name: Configure MSVC example
        if: runner.os == 'Windows'
        run: cmake -S examples -B build -A x64

      - name: Configure Linux example
        if: runner.os == 'Linux'
        run: cmake -S examples -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build native examples and enforce release gate
        run: cmake --build build --config Release

      - name: Inspect Windows example headers
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build\Release\releaseguard-example.exe exit /b 0
          dumpbin /headers build\Release\releaseguard-example.exe

      - name: Run example smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify ordinary and protected build controls
        if: runner.os == 'Linux'
        run: python benchmarks/native_compare.py --out native-comparison.json

      - name: Exercise cryptographic boundary controls (not a REA evaluation)
        run: python benchmarks/crypto_boundary.py --out crypto-boundary.json

      - name: Exercise server authorization boundary (not a REA evaluation)
        run: python benchmarks/dynamic_boundary.py --out dynamic-boundary.json

      - name: Check build-only analysis authorization and unchanged target files
        run: python benchmarks/analysis_boundary.py --out analysis-boundary.json

      - name: Build Python distribution
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Audit example PE
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build/Release/releaseguard-example.exe) {
            releaseguard audit build/Release/releaseguard-example.exe > pe-audit.json
          }

      - name: Keep example audit report
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-example-pe-audit
          path: pe-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep native build comparison
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-comparison-python-${{ matrix.python }}
          path: native-comparison.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep cryptographic boundary observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: crypto-boundary-${{ matrix.os }}-python-${{ matrix.python }}
          path: crypto-boundary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep server authorization observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dynamic-boundary-${{ matrix.os }}-python-${{ matrix.python }}
          path: dynamic-boundary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep analysis authorization observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: analysis-boundary-${{ matrix.os }}-${{ matrix.python }}
          path: analysis-boundary.json
          if-no-files-found: ignore
