name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the shared Python core
        run: python -m pip install -e .

      - name: Select the installed interpreter for isolated SDK calls
        run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('RELEASEGUARD_PYTHON=' + sys.executable + '\n')"

      - name: Test the dependency-free JavaScript bridge
        run: npm test --prefix packages/releaseguard

      - name: Test against the installed Python CLI
        run: npm run test:integration --prefix packages/releaseguard

      - name: Check TypeScript declarations
        if: runner.os == 'Linux'
        run: npm exec --yes --package=typescript@7.0.2 -- tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 packages/releaseguard/test/types-smoke.ts

      - name: Exercise portable checks without a native toolchain
        run: python -m unittest tests.test_distribution tests.test_distribution_cli -v

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Test C++ components with MSVC
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          where cl
          if errorlevel 1 exit /b 1
          set CXX=cl
          python -m unittest tests.test_native_literal tests.test_secure_buffer -v

      - name: Configure MSVC example
        if: runner.os == 'Windows'
        run: cmake -S examples -B build -A x64

      - name: Configure Linux example
        if: runner.os == 'Linux'
        run: cmake -S examples -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build native examples and enforce release gate
        run: cmake --build build --config Release

      - name: Inspect Windows example headers
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build\Release\releaseguard-example.exe exit /b 0
          dumpbin /headers build\Release\releaseguard-example.exe

      - name: Run example smoke test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify ordinary and protected build controls
        if: runner.os == 'Linux'
        run: python benchmarks/native_compare.py --out native-comparison.json

      - name: Exercise cryptographic boundary controls (not a REA evaluation)
        run: python benchmarks/crypto_boundary.py --out crypto-boundary.json

      - name: Exercise server authorization boundary (not a REA evaluation)
        run: python benchmarks/dynamic_boundary.py --out dynamic-boundary.json

      - name: Build Python distribution
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Audit example PE
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build/Release/releaseguard-example.exe) {
            releaseguard audit build/Release/releaseguard-example.exe > pe-audit.json
          }

      - name: Keep example audit report
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-example-pe-audit
          path: pe-audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep native build comparison
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-comparison-python-${{ matrix.python }}
          path: native-comparison.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep cryptographic boundary observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: crypto-boundary-${{ matrix.os }}-python-${{ matrix.python }}
          path: crypto-boundary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep server authorization observations
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dynamic-boundary-${{ matrix.os }}-python-${{ matrix.python }}
          path: dynamic-boundary.json
          if-no-files-found: ignore
          retention-days: 14
